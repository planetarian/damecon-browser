<!DOCTYPE html>
<html>

<head>
  <title>Damecon settings</title>
  <meta charset="utf-8">

  <script type="text/javascript" src="assets/js/jquery-3.3.1.min.js"></script>
  <script type="text/javascript" src="assets/js/popper.min.js"></script>
  <script type="text/javascript" src="assets/js/bootstrap.min.js"></script>
  <script type="text/javascript" src="assets/js/fontawesome.js"></script>

  <script type="text/javascript" src="assets/js/knockout-3.5.1.js"></script>
  <script type="text/javascript" src="assets/js/knockout-i18n.js"></script>

  <script type="text/javascript" src="common.js"></script>
  <script type="text/javascript" src="config-utils.js"></script>
  <script type="text/javascript" src="settings.js"></script>

  <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
  <link rel="stylesheet" href="webui.css" />
  <link rel="stylesheet" href="settings.css" />

  <link rel="icon" href="assets/icons/damecon_icon_48.png" />
</head>

<body>
  <div id="root" data-bind="attr: { class: `theme-${theme()} brightness-${brightness()}` }">
    <!-- ko if: settingsInitialized -->
    <div id="settings">
      <div id="settings-menu">
        <div class="menu-header">
          <!--<h5>Damecon</h5>-->
        </div>
        <div class="menu-items">
          <!-- ko foreach: configPages -->
          <div class="menu-item"
            data-bind="attr: { 'data-active': $parent.selectedConfigPage() === $data.id }, click: $parent.selectConfigPage.bind($parent)">
            <span class="icon">
              <!-- ko if: $data.img-->
              <img data-bind="attr: { src: img, alt: name }" alt="icon">
              <!-- /ko -->
              <!-- ko if: $data.faIcon -->
              <i data-bind="attr: { class: faIcon }"></i>
              <!-- /ko -->
            </span>
            <span class="header" data-bind="text: name"></span>
          </div>
          <!-- /ko -->
        </div>
        <div id="version">
          <span data-bind="text: version"></span>
        </div>
      </div>
      <div id="settings-container">
        <div class="settings-content">
          <div class="settings">
            <!-- ko template: { name: 'settings-content-' + selectedConfigPage() } -->
            <!-- /ko -->
          </div>
        </div>
        <div id="background-processes">
          <!-- ko foreach: processes -->
          <div class="process">
            <div class="process-name" data-bind="text: name"></div>
            <!-- ko if: !!$data.phase() || $data.total() > 0 -->
            <div class="process-text">
              <div class="process-phase" data-bind="text: phase"></div>
              <div class="process-progress" data-bind="text: progress"></div>
            </div>
            <!-- /ko -->
            <!-- ko if: $data.total() > 0 -->
            <div class="progress">
              <div class="progress-bar progress-bar-striped progress-bar-animated" title="progress bar" role="progressbar" data-bind="style: { width: progressPct() + '%'}"></div>
            </div>
            <!-- /ko -->
            <!-- ko if: $data.total() === 0 -->
            <div class="progress">
              <div class="progress-bar progress-bar-striped progress-bar-animated" title="progress bar" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
            <!-- /ko -->
          </div>
          <!-- /ko -->
        </div>
      </div>
    </div>
    <!-- /ko -->
  </div>
  <div id="settings-content-templates">

    <script type="text/html" id="settings-content-0">
      <h3>Damecon Settings</h3>
      <h5>Window</h5>
      <div class="settings-group">
        <div class="form-row">
          <label for="windowstyletheme" class="col-sm-3">Theme</label>
          <select id="windowstyletheme" class="col form-control" data-bind="options: configSchema.window.style.theme.options, value: config.window.style.theme"></select>
        </div>
        <div class="form-row">
          <label for="windowstylebright" class="col-sm-3">Brightness</label>
          <select id="windowstylebright" class="col form-control" data-bind="options: configSchema.window.style.brightness.options, value: config.window.style.brightness"></select>
        </div>
      </div>
      <div class="settings-group">
        <div class="form-group">
          <label>Hide address bar for sites (Alt+A to override)</label>
          <div class="form-items-scroller">
            <!-- ko foreach: config.window.view.hideAddressBarSites -->
            <div class="form-array-string-item input-group">
              <input type="text" class="form-control" data-bind="value: $rawData, valueUpdate: 'afterkeydown'" placeholder="e.g. https://tsunkit.net/*">
              <div class="input-group-append">
                <button type="button" class="btn btn-secondary" data-bind="click: () => $parent.removeHideAddressBarSite($data)"><i class="fa-sharp fa-solid fa-xmark"></i></button>
              </div>
            </div>
            <!-- /ko -->
          </div>
          <div class="form-array-string-item add-new">
            <label for="new-hide-adressbar-site-input">Add:</label>
            <div class="input-group">
              <input id="new-hide-adressbar-site-input" type="text" class="form-control" data-bind="value: newHideAddressBarSite, valueUpdate: 'afterkeydown'" placeholder="e.g. https://tsunkit.net/*">
              <div class="input-group-append">
                <button type="button" class="btn btn-secondary" data-bind="click: addNewHideAddressBarSite, enable: canAddNewHideAddressBarSite"><i class="fa-sharp fa-solid fa-plus"></i></button>
              </div>
            </div>
          </div>
        </div>
        <div class="form-row-gap">
          <div>
            <label>Show in tab bar when hidden:</label>
          </div>
          <div>
            <input type="checkbox" id="always-show-extensions" data-bind="checked: config.window.view.alwaysShowExtensions"></input>
            <label for="always-show-extensions" title="extensions"><i class="fa-solid fa-puzzle-piece"></i></label>
          </div>
          <div>
            <input type="checkbox" id="always-show-goback" data-bind="checked: config.window.view.alwaysShowBack"></input>
            <label for="always-show-goback" title="go back"><i class="fa-solid fa-arrow-left"></i></label>
          </div>
          <div>
            <input type="checkbox" id="always-show-goforward" data-bind="checked: config.window.view.alwaysShowForward"></input>
            <label for="always-show-goforward" title="go forward"><i class="fa-solid fa-arrow-right"></i></label>
          </div>
          <div>
            <input type="checkbox" id="always-show-reload" data-bind="checked: config.window.view.alwaysShowReload"></input>
            <label for="always-show-reload" title="refresh"><i class="fa-solid fa-rotate-right"></i></label>
          </div>
        </div>
      </div>
      <h5>Application</h5>
      <div class="settings-group">
        <div class="form-group form-check">
          <input class="form-check-input" id="appupdatesauto" type="checkbox" data-bind="checked: config.app.update.auto"></input>
          <label class="form-check-label" for="appupdatesauto">Download app updates automatically</label>
        </div>
        <div class="form-row">
          <label for="appdatalocation" class="col-sm-3">Data location</label>
          <select id="appdatalocation" class="col form-control" data-bind="options: configSchema.app.data.location.options, value: config.app.data.location"></select>
        </div>
        <!-- ko if: config.app.data.location() != 'custom' -->
        <div class="form-group">
          <div class="form-group"></div>
          <span>Path:</span>
          <span class="sensitive">
            <!-- ko if: config.app.data.location() == 'home' -->
            <span class="selectable" data-bind="text: paths.home"></span>
            <!-- /ko -->
            <!-- ko if: config.app.data.location() == 'appdata' -->
            <span class="selectable" data-bind="text: paths.appData"></span>
            <!-- /ko -->
            <!-- ko if: config.app.data.location() == 'appdir' -->
            <span class="selectable" data-bind="text: paths.app"></span>
            <!-- /ko -->
          </span>
        </div>
        <!-- /ko -->
        <!-- ko if: config.app.data.location() == 'custom' -->
        <div class="form-row">
          <label for="appdatacustompath" class="col-sm-4">Custom location</label>
          <div class="input-group col">
            <input type="text" id="appdatacustompath" class="form-control sensitive" data-bind="value: config.app.data.customPath"/>
            <div class="input-group-append">
              <button type="button" class="btn btn-secondary" data-bind="click: getCustomDataPath">Browse</button>
            </div>
          </div>
        </div>
        <!-- /ko -->
        <div class="form-group"></div>
        <div class="form-group">
          <span>Note: You will need to close and restart Damecon for the data location setting to take effect.</span>
        </div>
      </div>
      <div class="form-group">
        <button type="button" class="btn btn-secondary" data-bind="click: clearSessionCache">Clear browser cache</button>
      </div>
      <h5>Application Log</h5>
      <div class="settings-group">
        <div id="app-log-scroller" class="log-scroller">
          <ul>
            <!-- ko foreach: appLogRecent -->
            <li>
              <small>
                <span data-bind="text: $data[2], attr: { class: `badge badge-${$parent.badgeClasses[$data[2]]}` }"></span>
                <!-- ko foreach: $data.slice(3) -->
                <span data-bind="text: typeof $data === 'object' ? JSON.stringify($data) : $data"></span>
                <!-- /ko -->
              </small>
            </li>
            <!-- /ko -->
          </ul>
        </div>
      </div>
    </script>

    <script type="text/html" id="settings-content-1">
      <h3>KC3Kai Settings</h3>
      <div class="settings-group">
        <div class="form-row">
          <label for="kc3gamepage" class="col-sm-4">Game startup page</label>
          <select id="kc3gamepage" class="col form-control" data-bind="options: configSchema.kc3kai.startup.gamePage.options, value: config.kc3kai.startup.gamePage"></select>
        </div>
        <div class="form-check">
          <input class="form-check-input" id="kc3opendevtools" type="checkbox" data-bind="checked: config.kc3kai.startup.openDevtools"></input>
          <label class="form-check-label" for="kc3opendevtools">Auto-open devtools</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" id="kc3openstratroom" type="checkbox" data-bind="checked: config.kc3kai.startup.openStratRoom"></input>
          <label class="form-check-label" for="kc3openstratroom">Auto-open strategy room</label>
        </div>
      </div>
      <div class="settings-group">
        <div class="form-row">
          <label for="kc3updatechannel" class="col-sm-4">Update channel</label>
          <select id="kc3updatechannel" class="col form-control" data-bind="options: configSchema.kc3kai.update.channel.options, value: config.kc3kai.update.channel, enable: canSetKc3Channel"></select>
        </div>
        <!-- ko if: !config.kc3kai.update.channel()?.startsWith('custom') -->
        <div class="form-row">
          <label for="kc3updateschedule" class="col-sm-4">Update schedule</label>
          <select id="kc3updateschedule" class="col form-control" data-bind="options: configSchema.kc3kai.update.schedule.options, value: config.kc3kai.update.schedule"></select>
        </div>
        <div class="form-check">
          <input class="form-check-input" id="kc3updatesauto" type="checkbox" data-bind="checked: config.kc3kai.update.auto"></input>
          <label class="form-check-label" for="kc3updatesauto">Download/apply updates automatically</label>
        </div>
        <!-- /ko -->
        <!-- ko if: config.kc3kai.update.channel() === 'custom1' -->
        <div class="form-row">
          <label for="kc3custom1location" class="col-sm-4">Location</label>
          <div class="input-group col">
            <input type="text" id="kc3custom1location" class="form-control sensitive" data-bind="value: config.kc3kai.custom1Location"/>
            <div class="input-group-append">
              <button type="button" class="btn btn-secondary" data-bind="click: getCustomKc3Path">Browse</button>
            </div>
          </div>
        </div>
        <!-- /ko -->
        <!-- ko if: config.kc3kai.update.channel() === 'custom2' -->
        <div class="form-row">
          <label for="kc3custom2location" class="col-sm-4">Location</label>
          <div class="input-group col">
            <input type="text" id="kc3custom2location" class="form-control sensitive" data-bind="value: config.kc3kai.custom2Location"/>
            <div class="input-group-append">
              <button type="button" class="btn btn-secondary" data-bind="click: getCustomKc3Path">Browse</button>
            </div>
          </div>
        </div>
        <!-- /ko -->
      </div>
      <div class="form-group">
        <p>Note: reloading will automatically close any currently-open KC3 tabs.</p>
        <!-- ko if: !config.kc3kai.update.channel()?.startsWith('custom') -->
        <button class="btn btn-secondary" type="button" data-bind="click: kc3CheckForUpdates, enable: canUpdateKc3">Check for updates & reload</button>
        <!-- /ko -->
        <!-- ko if: config.kc3kai.update.channel()?.startsWith('custom') -->
        <button class="btn btn-secondary" type="button" data-bind="click: kc3CheckForUpdates, enable: canUpdateKc3">Reload</button>
        <!-- /ko -->
      </div>
    </script>

    <script type="text/html" id="settings-content-2">
      <h3>Proxy Settings</h3>
      <div class="settings-group" data-bind="enable: !kccpStatus().busy">
        <div class="form-check form-row row">
          <div class="form-check col-sm-3">
            <input class="form-check-input" id="proxyenable" type="checkbox" data-bind="checked: config.proxy.enable"></input>
            <label class="form-check-label" for="proxyenable">Enabled</label>
          </div>
          <label class="form-check-label" for="proxymode" class="col-sm-3">Mode</label>
          <select id="proxymode" class="col form-control" data-bind="options: configSchema.proxy.mode.options, value: config.proxy.mode"></select>
        </div>
      </div>
      <!-- ko if: config.proxy.mode().endsWith('-external') -->
      <h5>External Proxy</h5>
      <div class="settings-group">
        <div class="form-row">
          <label for="proxyclienthost" class="col-sm-3">Host</label>
          <input id="proxyclienthost" type="text" class="col form-control" data-bind="value: config.proxy.client.host" placeholder="Enter IP/host (e.g. 127.0.0.1)">
        </div>
        <div class="form-row">
          <label for="proxyclientport" class="col-sm-3">Port</label>
          <input id="proxyclientport" type="number" class="col form-control" data-bind="value: config.proxy.client.port" placeholder="Enter port (e.g. 8081)">
        </div>
      </div>
      <!-- /ko -->
      <!-- ko if: config.proxy.mode() === 'kccp-internal' -->
      <h5>KCCacheProxy</h5>
      <ul class="nav nav-tabs">
        <li class="nav-item">
          <a class="nav-link" href="#" data-bind="attr: { class: `nav-link${kccpTab() == 0 ? ' active' : ''}` }, click: () => kccpTab(0)">Proxy Log</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-bind="attr: { class: `nav-link${kccpTab() == 1 ? ' active' : ''}` }, click: () => kccpTab(1)">Configuration</a>
        </li>
        <!-- ko if: kccpConfig.enableModder -->
        <li class="nav-item">
          <a class="nav-link" href="#" data-bind="attr: { class: `nav-link${kccpTab() == 2 ? ' active' : ''}` }, click: () => kccpTab(2)">
            <span>Asset Mods</span>
            <!-- ko if: kccpModsOutOfDate() > 0 -->
            <span class="badge badge-danger" data-bind="text: kccpModsOutOfDate"></span>
            <!-- /ko -->
          </a>
        </li>
        <!-- /ko -->
      </ul>
      <div class="tab-content" data-bind="enable: !kccpStatus().busy">
        <!-- ko if: kccpTab() == 0 -->
        <div class="settings-group">
          <div id="kccp-log-scroller" class="log-scroller">
            <ul>
              <!-- ko foreach: kccpLogRecent -->
              <li>
                <small>
                  <span data-bind="text: $data[2], attr: { class: `badge badge-${$parent.badgeClasses[$data[2]]}` }"></span>
                  <!-- ko foreach: $data.slice(3) -->
                  <span data-bind="text: $data"></span>
                  <!-- /ko -->
                </small>
              </li>
              <!-- /ko -->
            </ul>
          </div>
        </div>
        <!-- /ko -->
        <!-- ko if: kccpTab() == 1 -->
        <div class="settings-group">
          <div class="form-row">
            <div class="col-sm-3"><label for="proxyclienthost">Hostname/IP</label></div>
            <div class="col">
              <input id="proxyclienthost" type="text" class="form-control" data-bind="value: kccpConfig.hostname" placeholder="Enter host/IP (e.g. 127.0.0.1)">
            </div>
          </div>
          <div class="form-row">
            <div class="col-sm-3"><label for="proxyclientport">Port</label></div>
            <div class="col">
              <input id="proxyclientport" type="number" class="form-control" data-bind="value: kccpConfig.port" placeholder="Enter port (e.g. 8081)">
            </div>
          </div>
          <p>KCCacheProxy is built into Damecon. The hostname/port settings can be used to allow other KanColle clients to connect through this KCCP instance.</p>
          <div class="form-check">
            <input class="form-check-input" id="useproxycachelocation" type="checkbox" data-bind="checked: kccpConfig.useCacheLocation"></input>
            <label class="form-check-label" for="useproxycachelocation">Custom Cache Location</label>
          </div>
          <!-- ko if: kccpConfig.useCacheLocation -->
          <div class="input-group col">
            <input id="proxycachelocation" type="text" class="form-control sensitive" data-bind="value: kccpConfig.cacheLocation, enable: kccpConfig.useCacheLocation" placeholder="Select cache location">
            <div class="input-group-append">
              <button type="button" class="btn btn-secondary-sm" data-bind="enable: kccpConfig.useCacheLocation">browse</button>
            </div>
          </div>
          <!-- /ko -->
          <div class="form-check">
            <input class="form-check-input" id="verifycache" type="checkbox" data-bind="checked: kccpConfig.verifyCache"></input>
            <label class="form-check-label" for="verifycache">Automatically verify cache integrity</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" id="disablebrowserCache" type="checkbox" data-bind="checked: kccpConfig.disableBrowserCache"></input>
            <label class="form-check-label" for="disablebrowserCache">Disable browser caching</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" id="gadgetbypass" type="checkbox" data-bind="checked: kccpConfig.bypassGadgetUpdateCheck"></input>
            <label class="form-check-label" for="gadgetbypass">Bypass gadget server</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" id="enablemodder" type="checkbox" data-bind="checked: kccpConfig.enableModder"></input>
            <label class="form-check-label" for="enablemodder">Enable asset modifiers</label>
          </div>
          <div class="form-group mt-3">
            <button type="button" class="btn btn-secondary" data-bind="click: kccpReloadCache" title="reload KCCP cache">Reload cache</button>
            <button type="button" class="btn btn-secondary" data-bind="click: kccpVerifyCache" title="verify KCCP cache">Verify cache (may take a bit)</button>
          </div>
          <div class="form-group">
            <button type="button" class="btn btn-secondary" data-bind="click: kccpImportBasicCacheDump" title="import built-in basic cache">Import built-in basic cache dump</button>
            <button type="button" class="btn btn-secondary" data-bind="click: kccpImportCacheDump" title="import cache dump">Import cache dump</button>
          </div>
          <div class="form-group">
            <span><a href="https://github.com/Tibowl/KCCacheProxy/wiki/Configuration">Configuration help</a></span>
          </div>
          <div class="form-group">
            <span><a href="https://github.com/Tibowl/KCCacheProxy/wiki/Installation-and-setup#using-cache-dumps">Where/how to get cache dumps</a></span>
          </div>
        </div>
        <!-- /ko -->
        <!-- ko if: kccpConfig.enableModder() && kccpTab() == 2 -->
        <div class="settings-group">
          <div class="form-items-scroller">
            <!-- ko foreach: kccpConfig.modInfo -->
            <div class="kccp-mod">
              <div class="kccp-mod-label">
                <div>
                  <span data-bind="text: `${$index()+1}.`"></span>
                  <span data-bind="text: info.name"></span>
                  <span data-bind="text: `v${info.version}`" class="subtext"></span>
                  <!-- ko if: $data.latestVersion && $data.latestVersion != $data.info.version -->
                  <a href="#" data-bind="click: () => chrome.tabs.create({url: info.url})" title="update available">
                    <span data-bind="text: `v${latestVersion} available!`" class="badge badge-info"></span> 
                  </a>
                  <!-- /ko -->
                </div>
                <span class="subtext" data-bind="text: info.authors.join(', ')"></span>
              </div>
              <div class="controls">
                <!-- ko if: $index() > 0 -->
                <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="click: () => $parent.kccpMoveMod($data.path, -1)" title="web site"><i class="fa-solid fa-arrow-up"></i></button>
                <!-- /ko -->
                <!-- ko if: $index() < $parent.kccpConfig.modInfo().length-1 -->
                <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="click: () => $parent.kccpMoveMod($data.path, 1)" title="web site"><i class="fa-solid fa-arrow-down"></i></button>
                <!-- /ko -->
                <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="click: () => chrome.tabs.create({url: info.url})" title="web site"><i class="fa-solid fa-globe"></i></button>
                <button type="button" class="btn btn-outline-danger btn-sm" data-bind="click: () => $parent.kccpRemoveMod($data.path)" title="remove"><i class="fa-regular fa-trash-can"></i></button>
              </div>
            </div>
            <!-- /ko -->
          </div>
          <div class="form-group mt-3">
            <button type="button" class="btn btn-secondary" data-bind="click: kccpAddMod">Add a patcher</button>
            <button type="button" class="btn btn-secondary" data-bind="click: kccpReloadMods">Reload mod data</button>
            <button type="button" class="btn btn-secondary" data-bind="click: kccpPrepatchAssets">Pre-patch ALL assets</button>
          </div>
          <h6>Advanced tools</h6>
          <div class="form-group">
            <button type="button" class="btn btn-secondary" data-bind="click: kccpExtractSpritesheet">Extract spritesheet</button>
            <button type="button" class="btn btn-secondary" data-bind="click: kccpMakeOutlines">Make outlines</button>
            <button type="button" class="btn btn-secondary" data-bind="click: kccpConvertFromPoi">Convert from poi</button>
          </div>
        </div>
        <!-- /ko -->
      </div>
      <!-- /ko -->
    </script>

    <script type="text/html" id="settings-content-3">
      <h3>Downloads
        <button type="button" class="btn btn-secondary btn-sm" data-bind="click: () => chrome.downloads.showDefaultFolder()" title="open downloads folder"><i class="fa-solid fa-folder"></i></button>
        <button type="button" class="btn btn-secondary btn-sm" data-bind="click: () => clearFinishedDownloads()" title="clear finished downloads"><i class="fa-regular fa-trash-can"></i></button>
      </h3>
      <div class="settings-group form-items-scroller">
        <!-- ko foreach: downloads -->
        <div class="download-item" data-bind="click: open">
          <div class="download-info">
            <span class="download-label">
              <label class="filename" data-bind="text: file"></label>
              <span class="bytes-received">
                <!-- ko if: state() == 'in_progress' && totalBytes() > 0 -->
                <label data-bind="text: `${received()}/${total()}`"></label>
                <!-- /ko -->
                <!-- ko if: state() == 'in_progress' && !totalBytes -->
                <label data-bind="text: received"></label>
                <!-- /ko -->
                <!-- ko if: ['complete','interrupted'].includes(state()) -->
                <label data-bind="text: total"></label>
                <label data-bind="text: `(${state()})`"></label>
                <!-- /ko -->
                <!-- ko if: paused() -->
                <label data-bind="text: ' (paused)'"></label> 
                <!-- /ko -->
              </span>
            </span>
            <div class="controls">
              <!-- ko if: state() === 'in_progress' && !paused() -->
              <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="click: pause, clickBubble: false" title="pause"><i class="fa-solid fa-pause"></i></button>
              <!-- /ko --> 
              <!-- ko if: canResume() -->
              <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="click: resume, clickBubble: false" title="resume"><i class="fa-solid fa-play"></i></button>
              <!-- /ko -->
              <!-- ko if: state() === 'complete' -->
              <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="click: openFolder, clickBubble: false" title="show in folder"><i class="fa-solid fa-folder-open"></i></button>
              <button type="button" class="btn btn-outline-danger btn-sm" data-bind="click: deleteFile, clickBubble: false" title="delete file"><i class="fa-regular fa-trash-can"></i></button>
              <!-- /ko -->
              <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="click: erase, clickBubble: false" title="remove entry"><i class="fa-solid fa-xmark"></i></button>
            </div>
          </div>
          <div class="download-progress">
            <!-- ko if: typeof progressPct() !== 'undefined' && progressPct() < 1 -->
            <div class="progress">
              <div class="progress-bar progress-bar-striped progress-bar-animated" title="progress bar" role="progressbar" data-bind="style: { width: progressPct()*100 + '%'}"></div>
            </div>
            <!-- /ko -->
            <!-- ko if: typeof progressPct() === 'undefined' -->
            <div class="progress">
              <div class="progress-bar progress-bar-striped progress-bar-animated" title="progress bar" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
            <!-- /ko -->
          </div>
        </div>
        <!-- /ko -->
        <!-- ko if: !downloads().length -->
        <div class="form-group">
          <div>
            <label>When you download files, they'll show up here.</label>
          </div>
        </div>
        <!-- /ko -->
      </div>
    </script>

  </div>
</body>

</html>
