<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Damecon</title>
    <script type="text/javascript" src="assets/js/jquery-3.3.1.min.js"></script>
    <script type="text/javascript" src="assets/js/knockout-3.5.1.js"></script>
    <script type="text/javascript" src="assets/js/knockout-i18n.js"></script>
    <link rel="stylesheet" href="assets/css/all.min.css" />
    <link rel="stylesheet" href="webui.css" />
  </head>
  <body>
    <!-- ko if: windowId() > 0 -->
    <div id="root" data-bind="attr: { class: `platform-${platform} theme-${theme()} brightness-${brightness()}` }">
      <div id="topbar-container" data-bind="rendered: setTopbarObserver.bind($data)">
        <div id="topbar">
          <div id="tabstrip">
            <ul class="tab-list">
              <!-- ko foreach: tabs() -->
              <li data-bind="attr: { class: `tab-container tab-separator-${separator()}${active() ? ' tab-active' : ''}${url==$parent.settingsUrl ? ' tab-compact' : ''}`},
                event: { mousedown: $parent.tabMouseDown.bind($parent), mousemove: $parent.tabMouseMove.bind($parent), mouseout: $parent.tabMouseOut.bind($parent), mouseup: $parent.tabMouseUp.bind($parent) }">
                <div class="tab">
                  <!-- ko if: !$index() && $parent.downloads().length -->
                  <img class="favicon" src="assets/icons/download_icon_48.png" alt="active downloads" />
                  <div class="progress-circle">
                    <div class="progress-content" data-bind="style: { '--pct': $parent.downloadPct() }"></div>
                  </div>
                  <!-- /ko -->
                  <!-- ko if: ($index() || !$parent.downloads().length) && favIconUrl --> 
                  <img class="favicon" data-bind="attr: { src: favIconUrl }" alt="page icon" />
                  <!-- /ko -->
                  <span class="title" data-bind="text: title"></span>
                  <div class="controls">
                    <!-- ko if: audible -->
                    <button type="button" class="control audio" title="audio playback" disabled>
                      <i class="fa-sharp fa-solid fa-volume-up"></i>
                    </button>
                    <!-- /ko -->
                    <!-- ko if: url != $parent.settingsUrl -->
                    <button type="button" class="control close" title="close tab" data-bind="click: $parent.browserActionCloseTab.bind($parent)">
                      <i class="fa-sharp fa-solid fa-xmark"></i>
                    </button>
                    <!-- /ko -->
                  </div>
                </div>
              </li>
              <!-- /ko -->
            </ul>
            <button id="createtab" type="button" title="create new tab" data-bind="click: browserActionNewTab">
              <div style="position: relative; width: 13px; height: 13px;">
                <div style="background: #ffffffaf; width: 1px; height: 13px; position: absolute; left: 6px;"></div>
                <div style="background: #ffffffaf; width: 13px; height: 1px; position: absolute; top: 6px;"></div>
              </div>
            </button>
            <div class="app-drag app-drag-right"></div>
            <div class="window-controls">
              <button id="minimize" type="button" class="control" title="minimize" data-bind="click: windowActionMinimize"><i class="fa-regular fa-window-minimize fa-xs"></i></button>
              <button id="maximize" type="button" class="control" title="maximize" data-bind="click: windowActionMaximize"><i class="fa-regular fa-square-full fa-2xs"></i></button>
              <button id="close" type="button" class="control" title="close" data-bind="click: windowActionClose"><i class="fa-solid fa-xmark"></i></button>
            </div>
          </div>
          <!-- ko if: activeTab()?.showAddressBar -->
          <div class="toolbar">
            <div class="page-controls">
              <button id="goback" type="button" class="control" title="go back" data-bind="click: browserActionGoBack"><i class="fa-solid fa-arrow-left"></i></button>
              <button id="goforward" type="button" class="control" title="go forward" data-bind="click: browserActionGoForward"><i class="fa-solid fa-arrow-right"></i></button>
              <button id="reload" type="button" class="control" title="reload" data-bind="click: browserActionReload"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
            <div class="address-bar">
              <input id="addressurl" type="text" spellcheck="false" title="address bar" data-bind="textInput: activeTab().urlInput, event: { keydown: browserActionAddressKeyDown }"/>
            </div>
            <browser-action-list id="actions"></browser-action-list>
          </div>
          <!-- /ko -->
        </div>
      </div>
      <div id="zoom-presenter" class="hidden"><span>100%</span></div>
    </div>
    <script src="./common.js"></script>
    <script src="./webui.js"></script>
    <!-- /ko -->
  </body>
</html>
